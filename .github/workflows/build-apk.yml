name: Build APK (Dev)

on:
  push:
    branches: ['**']
  workflow_dispatch:  # cho phép chạy thủ công từ GitHub UI

jobs:
  build:
    name: Build APK Split-per-ABI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 (required by Gradle)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      # 4. Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Generate localization & models (required by S.of(context) & *.g.dart)
      - name: Generate localization
        run: flutter pub run intl_utils:generate

      - name: Run build_runner
        run: flutter pub run build_runner build

      # 6. Create key.properties with debug keystore for CI
      - name: Setup signing (debug keystore)
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -storetype JKS \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000 \
            -noprompt 2>/dev/null || true
          printf 'storeFile=%s/.android/debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' "$HOME" > android/key.properties

      # 6. Build APK split-per-abi
      - name: Build APK (release, split-per-abi)
        run: flutter build apk --release --split-per-abi

      # 7. Upload APK artifacts
      - name: Upload APK arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload APK x86_64
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      # 9. Summary
      - name: Build Summary
        run: |
          echo "## ✅ Build APK thành công!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | File |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            size=$(du -h "$apk" | cut -f1)
            name=$(basename "$apk")
            echo "| ${name} | ${size} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Package: \`com.nodo.pm_app.dev\`" >> $GITHUB_STEP_SUMMARY
          echo "📱 Tải APK từ tab **Artifacts** phía trên" >> $GITHUB_STEP_SUMMARY
